name: Regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-core:
    name: Python core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-core.lock
      - run: python -m pip install -r requirements-core.lock
      # tests/isolation.py allocates a temporary data root and rejects network.
      # ProductionCaptureTests explicitly disables the config testing bypass.
      - run: python -m unittest discover -s tests -v

  javascript:
    name: Node controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.cjs

  browser:
    name: Browser synthetic acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: node tests/browser/deep-ui/run.cjs . output/playwright/deep-ui
      - run: node tests/browser/transcription-review.cjs
      - run: node tests/browser/frontend-lifecycle.cjs
      - run: node tests/browser/workspace-smoke.cjs
        env:
          QWEN_ASR_BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: output/playwright/

  linux-node:
    name: Linux inference node (mock workers)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-infer-node/requirements-gateway.lock
      - run: python -m pip install -r ai-infer-node/requirements-gateway.lock
      - run: python -m unittest discover -s ai-infer-node/tests -v
