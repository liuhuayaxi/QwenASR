<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7f5"><title>任务中心 · QwenASR</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/js/theme.js?v=20261011-ui-final"></script>
  <link rel="stylesheet" href="/static/ui.css?v=20261011-ui-final">
  <link rel="stylesheet" href="/static/tasks.css?v=20261014-ai-activity">
  <link rel="stylesheet" href="/static/custom-controls.css?v=20261014-selection-hover">
<link rel="stylesheet" href="/static/workspace.css?v=20261011-ui-final"><script>if (new URLSearchParams(location.search).get("embedded") === "1") document.addEventListener("DOMContentLoaded", () => document.body.classList.add("workspace-embedded"));</script>
</head>
<body class="tasks-page">
    <header class="app-header">
      <div class="app-header-inner">
        <a class="app-brand" href="/" aria-label="QwenASR 本地学习工作台">
          <span class="app-brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><b>QwenASR</b></span>
        </a>
        <nav class="app-nav" aria-label="主导航">
          <a href="/workspace">课程工作区</a>
          <a href="/">录音工作台</a>
          <a href="/library">课堂记录</a>
          <a href="/course/">课程回放</a>
          <a href="/course-files">PDF 资料库</a>
          <a href="/tasks" aria-current="page">任务中心</a>
        </nav>
        <div class="app-header-tools"><button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="切换深色模式" title="切换深色模式"><span data-theme-icon aria-hidden="true">☾</span><span data-theme-label>深色</span></button><a class="header-settings" data-open-settings href="/?settings=ai"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--paper)"/><circle cx="15" cy="17" r="3" fill="var(--paper)"/></svg><span>设置</span></a></div>
      </div>
    </header>
  <div class="tasks-layout">
    <aside class="task-sidebar">
      <p class="nav-label">任务管理</p>
      <nav id="statusFilters" class="task-nav" aria-label="任务状态">
        <button data-status="daily" aria-current="page">需要继续</button>
        <button data-status="all">全部任务 <span data-count="all">0</span></button>
        <button data-status="active">进行中 <span data-count="active">0</span></button>
        <button data-status="attention">待处理 <span data-count="attention">0</span></button>
        <button data-status="paused">已暂停 <span data-count="paused">0</span></button>
        <button data-status="completed">已完成 <span data-count="completed">0</span></button>
        <button data-status="cancelled">已取消 <span data-count="cancelled">0</span></button>
      </nav>

    </aside>
    <main class="task-content">
      <header class="page-heading"><div><p class="eyebrow">TASK CENTER</p><h1>任务中心</h1></div><button id="newPdf" class="ui-button primary">＋ 新建 PDF 识别</button></header>
      <section class="task-stats" aria-label="任务概览">
        <button data-summary="active"><span>进行中</span><b data-count="active">0</b></button>
        <button data-summary="attention"><span>待处理</span><b data-count="attention">0</b></button>
        <button data-summary="paused"><span>已暂停</span><b data-count="paused">0</b></button>
        <button data-summary="completed"><span>已完成</span><b data-count="completed">0</b></button>
      </section>
      <section class="task-section" aria-labelledby="listTitle">
        <div class="task-toolbar"><h2 id="listTitle">需要继续</h2><div class="task-filters">
          <label class="sr-only" for="taskSearch">搜索任务</label><input id="taskSearch" class="ui-field" type="search" placeholder="搜索任务、文件或课程…">
          <label class="sr-only" for="typeFilter">任务类型</label><select id="typeFilter" class="ui-field"><option value="">全部类型</option><option value="asr">录音转写与课程回放</option><option value="ai">录音 AI 任务</option><option value="summary">课后复习笔记</option><option value="refinement">未精修内容</option><option value="live_summary">实时累计总结</option><option value="mineru">全部 MinerU 识别</option><option value="course_pdf">课程资料识别</option><option value="pdf">本地 PDF 识别</option></select>
          <label class="sr-only" for="categoryFilter">课程</label><select id="categoryFilter" class="ui-field"><option value="">全部课程</option></select>
          <button id="refreshTasks" class="ui-button">刷新</button>
        </div></div>
        <div class="task-bulk"><label><input id="selectAll" type="checkbox"> 全选当前列表</label><span id="selectionCount">未选择任务</span><div><button data-bulk="continue" class="ui-button" disabled>继续</button><button data-bulk="pause" class="ui-button" disabled>暂停</button><button data-bulk="retry" class="ui-button" disabled>重试</button><button data-bulk="cancel" class="ui-button danger" disabled>取消</button><details class="task-history-tools"><summary>高级历史操作</summary><button id="retryFailed" class="ui-button primary" type="button">一键重试失败任务</button><button id="clearCompleted" class="ui-button" type="button">一键清理已完成</button><button id="restoreCompleted" class="ui-button" type="button" hidden>恢复刚清理的任务</button></details></div></div>
        <p id="loadError" class="task-notice error" role="alert" hidden></p>
        <p id="sourceWarning" class="task-notice" role="status" hidden></p>
        <p id="actionResult" class="task-notice" role="status" hidden></p>
        <div id="taskList" class="task-list" aria-busy="true"><div class="task-empty">正在读取任务…</div></div>
        <p id="lastUpdated" class="last-updated" role="status">正在连接任务服务</p>
      </section>
    </main>
  </div>
  <dialog id="pdfDialog" class="ui-dialog" aria-labelledby="pdfDialogTitle">
    <form id="pdfForm"><div class="dialog-header"><h2 id="pdfDialogTitle">新建 PDF 识别任务</h2><button id="closePdf" class="ui-button" type="button" aria-label="关闭">✕</button></div>
      <div class="dialog-body"><button id="choosePdf" class="ui-button" type="button">从 Finder 选择 PDF</button><label class="field-label" for="pdfPaths">文件绝对路径（每行一个，最多 20 个）</label><textarea id="pdfPaths" class="ui-field" rows="5" placeholder="/Users/你的用户名/Desktop/讲义.pdf" required></textarea><p id="pdfError" class="task-notice error" role="alert" hidden></p></div>
      <div class="dialog-footer"><button id="submitPdf" class="ui-button primary">加入识别队列</button></div></form>
  </dialog>
  <div id="toast" class="task-toast" role="status" hidden></div>
  <script type="module" src="/static/js/tasks.js?v=20261014-ai-activity"></script>
</body>
</html>
