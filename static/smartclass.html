<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>课程回放 · 自动转写</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202a39;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:64px auto;padding:0 24px}header{margin-bottom:32px}.eyebrow{font-size:13px;letter-spacing:2px;color:#687489}h1{font-size:32px;letter-spacing:-1px;margin:12px 0}p{line-height:1.7;color:#647086}.card{background:white;border:1px solid #e0e5ee;border-radius:20px;padding:28px;margin-bottom:20px;box-shadow:0 6px 24px #23345405}h2{font-size:19px;margin:0 0 20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:14px;color:#465268}input:not([type=checkbox]){width:100%;padding:13px;border:1px solid #cfd6e3;border-radius:9px;margin:8px 0 16px;font-size:16px}input:focus{outline:2px solid #96b5ff;outline-offset:2px}.save{display:flex;gap:9px;align-items:center;margin:5px 0 20px}button{border:0;border-radius:10px;background:#3265ce;color:#fff;padding:13px 20px;font-size:15px;cursor:pointer;margin:0 8px 8px 0}button.secondary{background:#eaf0fb;color:#36527e}button:disabled{opacity:.5;cursor:wait}.muted{font-size:13px;color:#778298}#state{font-size:17px;line-height:1.7}#identity{color:#447d61}a{color:#3265ce;text-decoration:none}.step{display:inline-flex;align-items:center;margin:0 16px 12px 0;font-size:14px;color:#6b7789}.step b{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#edf2fa;margin-right:8px;color:#3265ce}#result{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:600px){main{margin:32px auto}.fields{grid-template-columns:1fr}.card{padding:20px}}
</style>
<main><header><div class="eyebrow">QWEN ASR / 课程回放</div><h1>让课堂回放自动成为文字</h1><p>配置南邮统一身份认证账号，由本机程序登录课程平台，获取回放音频并转写。</p></header>
<section class="card"><details id="accountDetails" open><summary id="accountLabel">统一身份认证</summary><form id="login"><div class="fields"><label>学号 / 工号<input id="username" name="username" autocomplete="username" required></label><label>统一认证密码<input id="password" name="password" type="password" autocomplete="current-password" required></label></div><label class="save"><input id="save" type="checkbox" checked>保存在本机，用于以后自动登录</label><p class="muted">凭证仅保存到当前系统用户可读的 ~/.qwenasr/smartclass/，通过 HTTPS 发送到南邮统一认证服务器。</p><button id="connect" type="submit">保存并测试自动登录</button><button id="reconnect" class="secondary" type="button" hidden>使用已保存账号登录</button></form></details></section>
<section class="card"><h2>选择课程与课次</h2><p class="muted">只获取你勾选的回放。同一天、同一课程的两节相邻回放会合成一份笔记。</p><label>本学期课程<select id="courses"><option value="">登录后选择课程…</option></select></label><button id="refresh" class="secondary" type="button">刷新课程</button><button id="loadLessons" class="secondary" type="button">查看 / 刷新回放</button><div id="lessons" aria-live="polite"></div><label class="save"><input type="checkbox" id="allowSingle">允许单独获取尚未配对的一节课</label><details><summary>笔记设置</summary><label class="save"><input id="generateSummary" type="checkbox" checked>转写后生成 AI 课堂笔记</label><label class="save"><input id="aiCorrection" type="checkbox" checked>边转写边 AI 精修</label><div class="fields"><label>AI 接口地址<input id="summaryBase" type="url" placeholder="https://api.siliconflow.cn/v1"></label><label>AI 笔记模型<input id="summaryModel" placeholder="模型名称"></label></div><div class="fields"><label>精修接口地址<input id="correctionBase" type="url"></label><label>AI 精修模型<input id="correctionModel" placeholder="默认使用笔记模型"></label></div><p class="muted">使用语音工作台已保存的 AI 密钥。从工作台点击“课程回放转写”可同步当前模型和提示词。</p></details><button id="import" type="button" disabled>获取选中课次并生成笔记</button><button id="stop" class="secondary" type="button" hidden>停止当前队列</button></section>
<p id="notice" role="alert" style="color:#ab433e"></p><section class="card"><h2>运行状态</h2><div id="state" role="status" aria-live="polite">正在读取状态…</div><p id="identity"></p><div id="actions"></div><div id="result"></div></section>
<div><span class="step"><b>1</b>程序登录</span><span class="step"><b>2</b>同步课程回放</span><span class="step"><b>3</b>提取 video1 音轨</span><span class="step"><b>4</b>文件转写归档</span></div><p><a href="http://127.0.0.1:8765" target="_blank" rel="noopener">打开语音工作台 ↗</a></p></main>
<script>
const $ = id => document.getElementById(id);
let currentGroups = [], courseVersion = '', optionsLoaded = false;
let busy = false, loadingCourse = '', loadSerial = 0, accountCollapsed = false;
const css = document.createElement('style');
css.textContent = 'select{width:100%;font-size:15px;padding:12px;border:1px solid #cfd6e3;border-radius:9px;margin:8px 0 16px;background:#fff}.lesson{display:flex;gap:12px;align-items:flex-start;padding:16px 0;border-bottom:1px solid #edf0f5}.lesson input{margin-top:5px}.lesson strong{display:block;color:#293a55;font-size:15px}.lesson small{display:block;color:#788399;margin-top:6px}.job{padding:14px 0;border-top:1px solid #edf0f5}.job p{margin:5px 0;font-size:13px}.job a{margin-right:16px}details{margin:20px 0}summary{cursor:pointer;font-size:14px;margin-bottom:14px}#accountDetails{margin:0}#accountLabel{font-size:19px;font-weight:600;margin:0}#accountDetails[open] #accountLabel{margin-bottom:20px}progress{width:100%;height:8px;accent-color:#3265ce}';
document.head.append(css);
function notice(message = '') { $('notice').textContent = message; }
async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST', headers: {'Content-Type':'application/json','X-QwenASR-Client':'smartclass'},
    body: JSON.stringify(body || {})
  });
  const value = await r.json();
  if (!r.ok) throw Error(typeof value.detail === 'string' ? value.detail : '提交失败');
  return value;
}
function updateSelection() {
  $('import').disabled = busy || !!loadingCourse || !document.querySelector('#lessons input:checked:not(:disabled)');
  $('loadLessons').disabled = busy || !!loadingCourse || !$('courses').value;
}
function clearLessons() {
  loadSerial++;
  loadingCourse = '';
  currentGroups = [];
  $('lessons').replaceChildren();
  updateSelection();
}
function renderLessons() {
  const chosen = new Set([...document.querySelectorAll('#lessons input:checked')].map(e => e.value));
  $('lessons').replaceChildren();
  for (const g of currentGroups) {
    const row = document.createElement('label');
    row.className = 'lesson';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox'; checkbox.value = g.id;
    checkbox.disabled = g.videos.length === 1 && !$('allowSingle').checked;
    checkbox.checked = chosen.has(g.id) && !checkbox.disabled;
    checkbox.onchange = updateSelection;
    const text = document.createElement('div'), title = document.createElement('strong'), detail = document.createElement('small');
    title.textContent = g.course_name + ' · ' + g.date + ' ' + g.start.slice(11,16) + '–' + g.stop.slice(11,16);
    detail.textContent = g.videos.length === 2
      ? `第 ${g.periods.join('、')} 节 · 合计约 ${Math.round(g.duration / 60)} 分钟 → 一份笔记`
      : `第 ${g.periods[0]} 节 · 暂无相邻回放配对`;
    text.append(title, detail); row.append(checkbox, text); $('lessons').append(row);
  }
  if (!currentGroups.length) $('lessons').textContent = '此课程暂无可用回放。';
  updateSelection();
}
async function loadLessons() {
  const key = $('courses').value;
  if (!key) return;
  const serial = ++loadSerial;
  loadingCourse = key;
  $('lessons').textContent = '正在获取回放列表…';
  updateSelection(); notice();
  try {
    const response = await fetch('/api/lessons?course=' + encodeURIComponent(key));
    const result = await response.json();
    if (serial !== loadSerial) return;
    if (!response.ok) throw Error(result.detail);
    currentGroups = result.groups;
    renderLessons();
  } catch (e) {
    if (serial === loadSerial) { currentGroups = []; $('lessons').textContent = e.message; }
  } finally {
    if (serial === loadSerial) { loadingCourse = ''; updateSelection(); }
  }
}
function renderCourseState(s) {
  busy = ['connecting','syncing','running'].includes(s.state);
  $('refresh').disabled = busy || !s.identity;
  $('courses').disabled = busy;
  $('stop').hidden = s.state !== 'running';
  const version = JSON.stringify([s.course_revision, s.courses.map(c => [c.key, c.VideoTotal])]);
  if (version !== courseVersion) {
    courseVersion = version;
    const selected = $('courses').value;
    clearLessons();
    $('courses').replaceChildren(new Option('选择课程…', ''));
    for (const c of s.courses) {
      const duplicate = s.courses.filter(v => v.CourseName === c.CourseName && v.TeacherName === c.TeacherName).length > 1;
      const label = c.CourseName + ' · ' + (c.TeacherName || '') + ' · ' + c.VideoTotal + ' 节'
        + (duplicate ? ' · 教学班 ' + c.ClassID : '');
      $('courses').add(new Option(label, c.key));
    }
    if (s.courses.some(c => c.key === selected)) {
      $('courses').value = selected;
      if (!busy) loadLessons();
    }
  }
  if (!optionsLoaded && s.options.summary_provider) {
    const p = s.options.summary_provider;
    $('summaryBase').value = p.base_url || '';
    $('summaryModel').value = p.model || '';
    $('generateSummary').checked = s.options.generate_summary !== false;
    $('aiCorrection').checked = s.options.ai_correction !== false;
    const correction = s.options.correction_provider || p;
    $('correctionBase').value = correction.base_url || '';
    $('correctionModel').value = correction.model || '';
    optionsLoaded = true;
  }
  $('result').replaceChildren();
  for (const j of [...s.imports].reverse()) {
    const box = document.createElement('div'); box.className = 'job';
    const title = document.createElement('strong'), message = document.createElement('p');
    title.textContent = j.title; message.textContent = j.message; box.append(title, message);
    if (j.ai_errors) { const warning = document.createElement('p'); warning.textContent = j.ai_errors + ' 段精修未完成，原文已保留，可在工作台 AI 任务中重试'; box.append(warning); }
    if (j.state === 'running') {
      const meter = document.createElement('progress'); meter.max = 100; meter.value = j.progress || 0; box.append(meter);
    }
    if (j.state === 'completed') {
      for (const [name, url] of [['下载笔记',j.summary], ['音频与转写 ZIP',j.bundle]]) {
        if (!url) continue;
        const a = document.createElement('a'); a.href = url; a.textContent = name;
        a.target = '_blank'; a.rel = 'noopener'; box.append(a);
      }
    }
    $('result').append(box);
  }
  updateSelection();
}
async function refresh() {
  try {
    const r = await fetch('/api/status'), s = await r.json();
    $('state').textContent = s.message;
    $('identity').textContent = s.identity?.name ? '已连接：' + s.identity.name + ' · ' + s.term + ' 学期' : '';
    $('reconnect').hidden = !s.credentials_saved;
    $('connect').disabled = $('reconnect').disabled = ['connecting','syncing','running'].includes(s.state);
    if (s.identity && !accountCollapsed) {
      $('accountDetails').open = false;
      accountCollapsed = true;
    }
    if (s.state === 'error') $('accountDetails').open = true;
    $('accountLabel').textContent = s.identity?.name ? '账号已连接 · ' + s.identity.name : '统一身份认证';
    window.courseStatus = s;
    renderCourseState(s);
  } catch { $('state').textContent = '本机课程同步服务尚未连接'; }
}
$('login').addEventListener('submit', async e => {
  e.preventDefault(); notice();
  try {
    await post('/api/connect', {username:$('username').value,password:$('password').value,save:$('save').checked});
    $('password').value = ''; accountCollapsed = false; await refresh();
  } catch (e) { notice(e.message); }
});
$('reconnect').onclick = async () => {
  notice();
  try { await post('/api/reconnect'); await refresh(); } catch (e) { notice(e.message); }
};
$('courses').onchange = () => { clearLessons(); if ($('courses').value) loadLessons(); };
$('loadLessons').onclick = loadLessons;
$('allowSingle').onchange = () => { if (!loadingCourse) renderLessons(); };
$('refresh').onclick = async () => {
  notice();
  try { await post('/api/refresh'); await refresh(); } catch (e) { notice(e.message); }
};
$('import').onclick = async () => {
  const ids = [...document.querySelectorAll('#lessons input:checked:not(:disabled)')].map(e => e.value);
  $('import').disabled = true; notice();
  try {
    const p = {...(window.courseStatus?.options?.summary_provider || {}), base_url:$('summaryBase').value.trim(), model:$('summaryModel').value.trim()};
    const correction = {...(window.courseStatus?.options?.correction_provider || p), base_url:$('correctionBase').value.trim() || p.base_url, model:$('correctionModel').value.trim() || p.model};
    await post('/api/options', {generate_summary:$('generateSummary').checked, ai_correction:$('aiCorrection').checked, summary_provider:p, correction_provider:correction});
    await post('/api/import', {ids}); await refresh();
  } catch (e) { notice(e.message); updateSelection(); }
};
$('stop').onclick = async () => {
  try { await post('/api/stop'); notice('正在停止，已保存的转写进度会保留…'); } catch (e) { notice(e.message); }
};
refresh(); setInterval(refresh, 2000);
</script></html>
