<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7f5">
  <title>课程回放 · QwenASR</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/js/theme.js?v=20261010-routing-progress"></script>
  <link rel="stylesheet" href="/static/smartclass.css?v=20261008-pipeline-1">
  <link rel="stylesheet" href="/static/ui.css?v=20261002-theme-2">
<script>if (new URLSearchParams(location.search).get("embedded") === "1") document.addEventListener("DOMContentLoaded", () => document.body.classList.add("workspace-embedded"));</script>
<link rel="stylesheet" href="/static/workspace.css?v=20261011"></head>
<body class="replay-page">
    <header class="app-header">
      <div class="app-header-inner">
        <a class="app-brand" href="/" aria-label="QwenASR 本地学习工作台">
          <span class="app-brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><b>QwenASR</b></span>
        </a>
        <nav class="app-nav" aria-label="主导航">
          <a href="/workspace">课程工作区</a>
          <a href="/">录音工作台</a>
          <a href="/library">课堂记录</a>
          <a href="/notes">复习资料</a>
          <a href="/course/" aria-current="page">课程回放</a>
          <a href="/course-files">课程资料库</a>
          <a href="/tasks">任务中心</a>
        </nav>
        <div class="app-header-tools"><button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="切换深色模式" title="切换深色模式"><span data-theme-icon aria-hidden="true">☾</span><span data-theme-label>深色</span></button><span class="app-local">本地工作空间</span></div>
      </div>
    </header>
  <main class="replay-main">
    <header class="page-heading"><div><span class="eyebrow">COURSE REPLAY</span><h1>课程回放</h1></div></header>
    <p id="notice" role="alert"></p>
    <div class="replay-grid">
      <div class="replay-setup">
<section class="card">
        <details id="accountDetails" open>
        <summary id="accountLabel">统一身份认证</summary>
        <form id="login">
        <div class="fields">
        <label>学号 / 工号<input id="username" name="username" autocomplete="username" required class="ui-field"></label>
        <label>统一认证密码<input id="password" name="password" type="password" autocomplete="current-password" required class="ui-field"></label></div>
        <label class="save"><input id="save" type="checkbox" checked>保存在本机，用于以后自动登录</label>

        <button id="connect" type="submit" class="ui-button primary">保存并测试自动登录</button>
        <button id="reconnect" class="ui-button secondary" type="button" hidden>使用已保存账号登录</button>
        </form>
        </details>
        </section>

<section class="card">
        <h2>选择课程与课次</h2>

        <label>本学期课程<select id="courses" class="ui-field"><option value="">登录后选择课程…</option></select></label>
        <button id="refresh" class="ui-button secondary" type="button">刷新课程</button>
        <button id="loadLessons" class="ui-button secondary" type="button">查看 / 刷新回放</button><div id="lessons" aria-live="polite"></div>
        <label class="save"><input type="checkbox" id="allowSingle">允许单独获取尚未配对的一节课</label>
        <details>
        <summary>笔记设置</summary>
        <label class="save"><input id="generateSummary" type="checkbox" checked>转写后生成 AI 课堂笔记</label>
        <label class="save"><input id="aiCorrection" type="checkbox" checked>边转写边 转写校对</label>
        <div class="fields">
        <label>AI 接口地址<input id="summaryBase" type="url" placeholder="https://api.siliconflow.cn/v1" class="ui-field"></label>
        <label>AI 笔记模型<input id="summaryModel" placeholder="模型名称" class="ui-field"></label></div>
        <div class="fields">
        <label>精修接口地址<input id="correctionBase" type="url" class="ui-field"></label>
        <label>转写校对模型<input id="correctionModel" placeholder="默认使用笔记模型" class="ui-field"></label></div>

        <button id="saveOptions" class="ui-button secondary" type="button">保存笔记设置</button>
        <p id="optionsStatus" class="muted" role="status"></p>
        </details>
        <button id="import" type="button" disabled class="ui-button primary">将选中课次加入队列</button>
        <button id="stop" class="ui-button secondary" type="button" hidden>暂停队列</button>
        <button id="resumeQueue" hidden class="ui-button primary">继续已保存队列</button>
        </section>

</div>
<section class="card replay-status">
        <h2>运行状态</h2><div id="state" role="status" aria-live="polite">正在读取状态…</div><p id="identity"></p><div id="actions"></div><div id="result"></div>
        </section>

    </div>
    <div class="replay-workflow" aria-label="处理流程"><span class="step"><b>1</b>登录账号</span><span class="step"><b>2</b>选择课程回放</span><span class="step"><b>3</b>获取音频</span><span class="step"><b>4</b>转写与精修</span><span class="step"><b>5</b>生成笔记</span></div>
  </main>
  <script>
    // The course UI is mounted below /course while its API paths remain
    // relative to the original standalone service. Keep the page source
    // simple and route only its API calls through the mounted sub-app.
    const courseBase = '/course';
    const nativeFetch = window.fetch.bind(window);
    window.fetch = (input, init) => {
      if (typeof input === 'string' && input.startsWith('/api/')) input = courseBase + input;
      return nativeFetch(input, init);
    };
  </script>
  <script src="/static/js/smartclass.js?v=20261011-20261010-routing-progress"></script>
</body>
</html>
