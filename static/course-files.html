<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7f5"><title>PDF 资料库 · QwenASR</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/js/theme.js?v=20261011-ui-final"></script>
  <link rel="stylesheet" href="/static/course-files.css?v=20261013-time-1">
  <link rel="stylesheet" href="/static/review-materials.css?v=20261013">
  <link rel="stylesheet" href="/static/ui.css?v=20261011-ui-final">
<script>if (new URLSearchParams(location.search).get("embedded") === "1") document.addEventListener("DOMContentLoaded", () => document.body.classList.add("workspace-embedded"));</script>
<link rel="stylesheet" href="/static/workspace.css?v=20261011-ui-final"></head>
<body class="course-files-page">
    <header class="app-header">
      <div class="app-header-inner">
        <a class="app-brand" href="/" aria-label="QwenASR 本地学习工作台">
          <span class="app-brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><b>QwenASR</b></span>
        </a>
        <nav class="app-nav" aria-label="主导航">
          <a href="/workspace">课程工作区</a>
          <a href="/">录音工作台</a>
          <a href="/library">课堂记录</a>
          <a href="/course/">课程回放</a>
          <a href="/course-files" aria-current="page">PDF 资料库</a>
          <a href="/tasks">任务中心</a>
        </nav>
        <div class="app-header-tools"><button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="切换深色模式" title="切换深色模式"><span data-theme-icon aria-hidden="true">☾</span><span data-theme-label>深色</span></button><a class="header-settings" data-open-settings href="/?settings=ai"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--paper)"/><circle cx="15" cy="17" r="3" fill="var(--paper)"/></svg><span>设置</span></a></div>
      </div>
    </header>
  <div class="files-layout">
  <aside class="course-sidebar">
    <div class="nav-label">我的课程</div>
    <nav class="course-nav" id="courses" aria-label="课程"></nav>
    <form id="newCourseForm"><label class="sr-only" for="newCourse">新课程名称</label><input id="newCourse" placeholder="新课程名称" maxlength="80" required class="ui-field"><button title="新建课程" aria-label="新建课程" class="ui-button">＋</button></form>
    <div class="side-bottom"><span class="dot"></span>文件保存在本机<a href="/">← 返回录音工作台</a></div>
  </aside>
  <main class="course-content">
    <header class="page-heading"><div><p class="eyebrow">PDF LIBRARY</p><h1 id="courseTitle">PDF 资料库</h1><p id="courseMeta" class="muted"></p></div><div class="category-actions" aria-label="当前分类操作"><button id="renameCategory" class="ui-button" disabled>重命名分类</button><button id="deleteCategory" class="ui-button danger" disabled>删除分类</button><button id="reveal" class="ui-button">在 Finder 中打开</button></div></header>
    <section id="dropzone" class="dropzone" aria-label="添加课程文件">
      <div class="upload-icon" aria-hidden="true">↑</div><div><h2>拖入文件，或点击添加</h2></div>
      <div class="upload-controls"><label for="uploadKind" class="sr-only">资料类型</label><select id="uploadKind" class="ui-field"><option>课件</option><option>讲义</option><option>作业</option><option>参考资料</option><option>复习资料</option><option>其他</option></select><button id="addFiles" class="ui-button primary">＋ 添加文件</button></div>
      <input id="filesInput" type="file" multiple hidden><input id="replaceInput" type="file" hidden>
    </section>
    <p id="uploadStatus" class="notice" role="status" hidden></p>
<section class="review-tools" aria-label="复习资料工具">
<p id="review-loadError" class="notice error" role="alert" hidden></p>
      <details class="storage-disclosure"><summary>保存位置</summary><section class="path-card" aria-label="笔记保存位置"><div><b>笔记保存位置</b><p id="review-storagePath" class="muted"></p></div><div class="path-actions"><button id="review-chooseRoot" class="ui-button" type="button">选择文件夹</button><button id="review-saveRoot" class="ui-button" type="button">保存路径</button></div><input id="review-rootInput" class="ui-field wide" spellcheck="false" aria-label="笔记保存绝对路径"></section></details>
      <details class="external-import"><summary>导入复习资料</summary><div class="notes-grid">
        <section class="panel lesson-panel" aria-labelledby="review-lessonHeading"><div class="panel-heading"><div><h2 id="review-lessonHeading">选择课次</h2></div><span id="review-lessonCount" class="count-badge">0</span></div><div id="review-lessons" class="lesson-list"></div><p id="review-lessonEmpty" class="empty-inline" hidden>这门课还没有保存的录音课次。</p><div class="selection-bar"><span id="review-selectionText">尚未选择课次</span><button id="review-clearSelection" class="ui-button" type="button">清除选择</button></div></section>
        <section class="panel prompt-panel" aria-labelledby="review-promptHeading"><div class="panel-heading"><div><h2 id="review-promptHeading">生成提示词</h2></div><button id="review-copyPrompt" class="ui-button primary" type="button" disabled>复制提示词</button></div><label class="field-label" for="review-promptTemplate">提示词模板 <small>可使用 {{course}} 和 {{lessons}}</small></label><textarea id="review-promptTemplate" class="ui-field prompt-editor" rows="16" spellcheck="false"></textarea><div class="prompt-actions"><button id="review-saveTemplate" class="ui-button" type="button">保存模板</button><button id="review-generatePrompt" class="ui-button primary" type="button">生成并复制</button></div><p id="review-promptStatus" class="notice" role="status" hidden></p><label class="field-label" for="review-promptOutput">本次生成结果</label><textarea id="review-promptOutput" class="ui-field prompt-output" rows="8" readonly placeholder="选择课次后点击“生成并复制”"></textarea></section>
      </div>
      <section class="panel upload-panel" aria-labelledby="review-uploadHeading"><div class="panel-heading"><div><h2 id="review-uploadHeading">上传外部复习资料</h2></div><span id="review-selectedForUpload" class="muted"></span></div><form id="review-uploadForm"><div class="upload-fields"><label class="field-label">资料名称<input id="review-noteTitle" class="ui-field" maxlength="120" placeholder="例如：物理光学·期中复习" required></label><label class="field-label">PDF 文件<input id="review-noteFile" class="ui-field" type="file" accept="application/pdf,.pdf" required></label></div><div class="upload-actions"><button class="ui-button primary" type="submit">保存复习资料</button><span id="review-uploadStatus" class="muted" role="status"></span></div></form></section>
      </details>

</section>
    <section class="file-section">
      <div class="section-toolbar"><h2>全部资料 <span id="fileCount">0</span></h2><div><button id="upgradeLegacy" class="ui-button primary" type="button" hidden>升级旧版识别</button><label for="search" class="sr-only">搜索文件</label><input id="search" type="search" placeholder="搜索文件名…" class="ui-field"><label class="sr-only" for="kindFilter">筛选类型</label><select id="kindFilter" class="ui-field"><option value="">所有类型</option><option>课件</option><option>讲义</option><option>作业</option><option>参考资料</option><option>复习资料</option><option>其他</option></select><button id="refresh" aria-label="刷新文件" class="ui-button">刷新</button></div></div>
      <p id="loadError" class="notice error" role="alert" hidden></p>
      <div id="files" class="files"></div>
    </section>
    <footer class="file-footer"><p id="directory"></p><p id="capabilities"></p></footer>
  </main>
  </div>
  <dialog id="fileDialog" class="ui-dialog category-dialog" aria-labelledby="fileDialogTitle">
    <form id="fileForm">
      <div class="dialog-header"><h2 id="fileDialogTitle">重命名文件</h2><button id="closeFile" type="button" class="ui-button" aria-label="关闭">✕</button></div>
      <div class="dialog-body"><p id="fileDescription" class="muted"></p><label id="fileNameLabel" class="field-label" for="fileName">文件名（保留扩展名）</label><input id="fileName" class="ui-field wide" maxlength="80" required><p id="fileError" class="notice error" role="alert" hidden></p></div>
      <div class="dialog-footer"><button id="cancelFile" type="button" class="ui-button">取消</button><button id="saveFile" type="submit" class="ui-button primary">保存名称</button></div>
    </form>
  </dialog>
  <dialog id="categoryDialog" class="ui-dialog category-dialog" aria-labelledby="categoryDialogTitle" aria-describedby="categoryDescription">
    <form id="categoryForm">
      <div class="dialog-header"><h2 id="categoryDialogTitle">重命名分类</h2><button id="closeCategory" type="button" class="ui-button" aria-label="关闭分类管理">✕</button></div>
      <div class="dialog-body">
        <p id="categoryDescription" class="muted"></p>
        <div id="categoryNameField"><label class="field-label" for="categoryName">新分类名称</label><input id="categoryName" class="ui-field wide" maxlength="80" autocomplete="off" required></div>
        <p id="categoryError" class="notice error" role="alert" hidden></p>
      </div>
      <div class="dialog-footer"><button id="cancelCategory" type="button" class="ui-button">取消</button><button id="saveCategory" type="submit" class="ui-button primary">保存名称</button></div>
    </form>
  </dialog>
  <dialog id="syncDialog" class="ui-dialog" aria-labelledby="syncDialogTitle">
    <div class="dialog-header"><div><p class="eyebrow">IDEASHELL</p><h2 id="syncDialogTitle">匹配笔记并上传附件</h2></div><button id="closeSync" aria-label="关闭" class="ui-button">✕</button></div>
    <div class="dialog-body">
      <div class="sync-file"><b id="syncFileName"></b><label for="variant">上传版本</label><select id="variant" class="ui-field"><option value="pdf">AI 易读 PDF</option><option value="original">原件</option></select></div>
      <div class="connection"><label class="sr-only" for="region">闪念贝壳账号区域</label><select id="region" class="ui-field"><option value="china">中国大陆账号</option><option value="global">全球账号</option></select><button id="connect" class="ui-button">连接闪念贝壳</button><span id="connectionStatus" class="muted"></span><a id="authorize" target="_blank" rel="noopener" hidden>打开授权页面</a></div>
      <label class="field-label" for="noteQuery">查找目标笔记</label><div class="search-row"><input id="noteQuery" placeholder="课程名、章节或笔记标题" class="ui-field"><button id="searchNotes" class="ui-button">搜索闪念贝壳</button></div>

      <div id="candidates" class="candidates"></div>
      <p id="matchStatus" class="notice" role="status" hidden></p>
      <label class="field-label" for="noteId">目标笔记编号</label><input id="noteId" class="ui-field wide" placeholder="选择上方笔记，或粘贴完整的 32 位编号" maxlength="32" autocomplete="off">
      <p id="syncStatus" class="notice" role="status" hidden></p>
      <div id="preview" class="preview" hidden></div>
      <p id="syncHint" class="small muted" role="status"></p>

    </div>
    <div class="dialog-footer"><button id="previewButton" class="ui-button">预览上传目标</button><button id="syncButton" class="ui-button primary" disabled>确认上传附件</button></div>
  </dialog>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="/static/js/course-files.js?v=20261013-time-1"></script>
</body>
</html>
