<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程工作区 · QwenASR</title><script src="/static/js/theme.js?v=20261011-ui-final"></script><link rel="stylesheet" href="/static/ui.css?v=20261011-ui-final"><link rel="stylesheet" href="/static/custom-controls.css?v=20261014-selection-hover"><link rel="stylesheet" href="/static/workspace.css?v=20261014-followups-1"></head><body class="workspace-page">
<header class="app-header"><div class="app-header-inner"><a class="app-brand" href="/workspace" aria-label="QwenASR 本地学习工作台"><span class="app-brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span><b>QwenASR</b></span></a><nav class="app-nav" aria-label="主导航"><a href="/workspace" aria-current="page">课程工作区</a><a href="/">录音工作台</a><a href="/library">课堂记录</a><a href="/course/">课程回放</a><a href="/course-files">PDF 资料库</a><a href="/tasks">任务中心</a></nav><div class="app-header-tools"><button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="切换深色模式" title="切换深色模式"><span data-theme-icon aria-hidden="true">☾</span><span data-theme-label>深色</span></button><a class="header-settings" data-open-settings href="/?settings=ai"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--paper)"/><circle cx="15" cy="17" r="3" fill="var(--paper)"/></svg><span>设置</span></a></div></div></header>
<main class="course-workspace">
  <header class="workspace-heading">
    <div class="workspace-heading-title"><p class="eyebrow">课程工作区</p><h1 id="workspaceTitle">我的课程</h1><p id="workspaceMeta" class="workspace-meta" role="status">正在读取课程…</p></div>
    <div class="workspace-heading-actions"><label class="sr-only" for="workspaceCourse">当前课程</label><select id="workspaceCourse" class="ui-field" disabled><option>读取课程…</option></select><button id="newClass" class="ui-button primary"><span aria-hidden="true">＋</span> 新建课堂记录</button></div>
  </header>
  <nav id="workspaceTabs" class="workspace-tabs" aria-label="课程内容">
    <button data-tab="overview" aria-current="page">概览</button><button data-tab="records">课堂记录</button><button data-tab="notes">课堂笔记</button><button data-tab="materials">课程资料</button><button data-tab="review">问答与复习</button>
    <button id="workspaceTasks" class="workspace-tasks-link">任务时间线 <span aria-hidden="true">↗</span></button>
  </nav>
  <p id="workspaceError" role="alert" hidden></p>
  <section id="workspaceOverview" aria-label="课程概览">
    <section class="workspace-section workspace-recent-section"><header class="workspace-section-heading"><h2>最近课堂</h2><button class="workspace-text-action" data-tab="records">全部课堂 <span aria-hidden="true">→</span></button></header><div id="workspaceRecent"><p class="workspace-empty">正在读取…</p></div></section>
    <aside class="workspace-side">
      <section class="workspace-section"><header class="workspace-section-heading"><h2 id="workspaceTaskHeading">待处理任务</h2><span id="workspaceTaskCount" class="workspace-count"></span></header><div id="workspaceTimeline"><p class="workspace-empty">正在读取…</p></div><button class="workspace-text-action workspace-task-more" data-timeline>全部任务 <span aria-hidden="true">→</span></button></section>
      <section class="workspace-section workspace-resources"><h2>课程资料</h2><button data-tab="materials"><span class="workspace-resource-icon" aria-hidden="true">▤</span><span>课件与讲义</span><span aria-hidden="true">→</span></button><button data-external-review><span class="workspace-resource-icon" aria-hidden="true">▧</span><span>复习资料</span><span aria-hidden="true">→</span></button></section>
    </aside>
  </section>
  <section id="workspaceReview" class="workspace-section" hidden><header class="workspace-section-heading"><h2>课堂问答</h2><button class="workspace-text-action" data-external-review>复习资料 <span aria-hidden="true">→</span></button></header><div id="workspaceQuestions"><p class="workspace-empty">正在读取…</p></div></section>
  <iframe id="workspaceFrame" title="课程内容" hidden></iframe>
  <dialog id="workspaceNoteDialog" class="workspace-note-dialog" aria-labelledby="workspaceNoteTitle"><header class="workspace-note-header"><h2 id="workspaceNoteTitle">课堂笔记</h2><button type="button" class="ui-button" data-close-note>关闭并返回课程</button></header><iframe id="workspaceNoteFrame" title="课堂笔记"></iframe></dialog>
  <dialog id="newClassDialog" class="ui-dialog workspace-source-dialog" aria-labelledby="newClassTitle"><div class="dialog-header"><h2 id="newClassTitle">新建课堂记录</h2><button data-close="newClassDialog" class="ui-button" aria-label="关闭">✕</button></div><div class="dialog-body workspace-source"><a id="microphoneSource" href="/"><span class="source-icon" aria-hidden="true">◉</span><span><b>现场录音</b><small>麦克风实时转写</small></span><span aria-hidden="true">→</span></a><a id="uploadSource" href="/?source=upload"><span class="source-icon" aria-hidden="true">↑</span><span><b>上传录音</b><small>音频或视频文件</small></span><span aria-hidden="true">→</span></a><a href="/course/"><span class="source-icon" aria-hidden="true">▷</span><span><b>课程回放</b><small>南邮 SmartClass</small></span><span aria-hidden="true">→</span></a></div></dialog>
  <dialog id="timelineDialog" class="timeline-drawer" aria-labelledby="timelineTitle"><div class="dialog-header"><h2 id="timelineTitle">课程任务</h2><button data-close="timelineDialog" class="ui-button" aria-label="关闭">✕</button></div><iframe id="timelineFrame" title="课程任务"></iframe></dialog>
</main>
<script type="module" src="/static/js/workspace.js?v=20261014-followups-1"></script>
</body></html>
